<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
        window.location.replace('/');
      }
    </script>
    <title>ZEN FLOW 手機預覽</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ded8cf;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .wrap {
        display: grid;
        gap: 12px;
        justify-items: center;
        padding: 18px;
      }

      .label {
        color: #756e65;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .phone {
        width: 414px;
        height: 868px;
        max-width: calc(100vw - 32px);
        overflow: hidden;
        border: 12px solid #2f2e2b;
        border-radius: 34px;
        background: #f7f4ee;
        box-shadow: 0 24px 70px rgb(47 46 43 / 24%);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="label">ZEN FLOW Mobile Preview - 390 x 844</div>
      <section class="phone" aria-label="Mobile preview">
        <iframe src="/" title="ZEN FLOW frontend mobile preview"></iframe>
      </section>
    </main>
  </body>
</html>
