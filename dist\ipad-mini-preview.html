<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZEN FLOW iPad mini 預覽</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ded8cf;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .wrap {
        display: grid;
        gap: 12px;
        justify-items: center;
        padding: 18px;
      }

      .label {
        color: #756e65;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .tablet {
        width: 744px;
        height: 1133px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 62px);
        overflow: hidden;
        border: 12px solid #2f2e2b;
        border-radius: 34px;
        background: #f7f4ee;
        box-shadow: 0 24px 70px rgb(47 46 43 / 24%);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="label">ZEN FLOW iPad mini Preview - 744 x 1133</div>
      <section class="tablet" aria-label="iPad mini preview">
        <iframe src="/backend" title="ZEN FLOW iPad mini backend preview"></iframe>
      </section>
    </main>
  </body>
</html>
